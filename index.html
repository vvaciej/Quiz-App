    <header class="header">
      <section class="header-choosed">
      </section>
      <section>
        <i class="fa-solid fa-sun"></i>
        <div class="theme-switcher" role="theme switch"></div>
        <i class="fa-solid fa-moon"></i>
      </section>
    </header>

    <main class="main">
      <!--Choose Quiz-->
      <div class="main-choose-quiz" role="choose type of quiz">
        <section class="main-text-section">
          <h1>Welcome to the <br> <b>Frontend Quiz!</b></h1>
          <i>Pick a subject to get started.</i>
        </section>
        <section class="main-choose-quiz-section quiz-section">
          <button class="question-btn choose-quiz-btn">
            <div class="html-icon quiz-icon">
              <i class="fa-solid fa-code"></i>
            </div>
            <h2>HTML</h2>
          </button>
          <button class="question-btn choose-quiz-btn">
            <div class="css-icon quiz-icon">
              <i class="fa-solid fa-brush"></i>
            </div>
            <h2>CSS</h2>
          </button>
          <button class="question-btn choose-quiz-btn">
            <div class="js-icon quiz-icon">
              <i class="fa-brands fa-js"></i>
            </div>
            <h2>Javascript</h2>
          </button>
          <button class="question-btn choose-quiz-btn">
            <div class="access-icon quiz-icon">
              <i class="fa-solid fa-universal-access"></i>
            </div>
            <h2>Accessibility</h2>
          </button>
        </section>
      </div>

      <!--Questions for HTML-->
      <div class="text-question-area html-first-question hide">
        <section class="main-text-quiz-section">
          <i><b>Question 1 of 10</b></i>
          <h1>
            <p>
              Czym jest kod semantyczny?
            </p>
          </h1>
          <div class="progress-bar"></div>
        </section>
        <section class="html-quiz-questions-section quiz-section">
          <button class="submit-answer">
            <h1><b>Submit answer</b></h1>
          </button>
        </section>
      </div>
      <div class="text-question-area html-second-question hide">
        <section class="main-text-quiz-section">
          <i><b>Question 2 of 10</b></i>
          <h1>
            <p>
              Czym jest accessibility?
            </p>
          </h1>
          <div class="progress-bar"></div>
        </section>
        <section class="html-quiz-questions-section quiz-section">
          <button class="submit-answer">
            <h1><b>Submit answer</b></h1>
          </button>
        </section>
      </div>
      <div class="text-question-area html-third-question hide">
        <section class="main-text-quiz-section">
          <i><b>Question 3 of 10</b></i>
          <h1>
            <p>
              Czym jest <abbr>SEO</abbr>?
            </p>
          </h1>
          <div class="progress-bar"></div>
        </section>
        <section class="html-third-questions-section quiz-section">
          <button class="question-btn">
            <div class="quiz-icon">
              <h1 class="quiz-answer-text"><b>A</b></h1>
            </div>
            <h2>
              <p>
                SEO to proces optymalizacji strony w celu poprawy 
                jej widoczności w wynikach wyszukiwania.
              </p>
            </h2>
          </button>
          <button class="question-btn">
            <div class="quiz-icon">
              <h1 class="quiz-answer-text"><b>B</b></h1>
            </div>
            <h2>
              <p>
                SEO oznacza ukrywanie treści przed użytkownikami, aby podnieść pozycje
                w wynikach wyszukiwania.
              </p>
            </h2>
          </button>
          <button class="question-btn">
            <div class="quiz-icon">
              <h1 class="quiz-answer-text"><b>C</b></h1>
            </div>
            <h2>
              <p>
                SEO w HTML to rodzaj kodu używanego do przechowywania sekretnych 
                informacji na stronie internetowej.
              </p>
            </h2>
          </button>
          <button class="question-btn">
            <div class="quiz-icon">
              <h1 class="quiz-answer-text"><b>D</b></h1>
            </div>
            <h2>
              <p>
                SEO w HTML to rodzaj emotikonu lub emoji używanego do wyrażania emocji na 
                stronach internetowych aby przyciągnąć użytkownika.
              </p>
            </h2>
          </button>
          <button class="submit-answer">
            <h1><b>Submit answer</b></h1>
          </button>
        </section>
      </div>
